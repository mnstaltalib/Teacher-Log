<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تعبئة سجل التقييم الذكية</title>
    <!-- استيراد خط كايرو (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f8fafc 100%, #e2e8f0 0%);
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: #334155;
        }

        textarea, select, input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #1e293b;
        }

        textarea:focus, select:focus, input[type="number"]:focus {
            border-color: var(--primary);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            height: 150px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            margin-top: 10px;
            font-family: 'Cairo', sans-serif;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            text-align: center;
            margin-top: 18px;
            font-weight: 700;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #475569;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
            font-weight: 700;
        }

        .footer span {
            color: var(--primary);
            font-weight: 900;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            .row { flex-direction: column; gap: 0; }
        }
    </style>
    <!-- تضمين مكتبة PDFLib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>

<div class="container">
    <h1>سجل التقييم المدرسي</h1>
    <div class="subtitle">أداة ذكية لكتابة وتوزيع اسماء الطلاب آليا في السجلات المدرسية</div>

    <div class="form-group">
        <label for="recordType">اختر المرحلة / السجل:</label>
        <select id="recordType">
            <option value="first_secondary">الصف الأول الثانوي</option>
            <option value="second_secondary_bac">الصف الثاني الثانوي - باكالوريا</option>
            <option value="second_secondary_general">الصف الثاني الثانوي - عام</option>
        </select>
    </div>

    <div class="form-group">
        <label for="studentNames">أسماء الطلاب (كل اسم في سطر مستقل):</label>
        <textarea id="studentNames" placeholder="اكتب أو الصق أسماء الطلاب هنا..."></textarea>
    </div>

    <div class="row">
        <div class="form-group col">
            <label for="maxFontSize">حجم الخط الأقصى:</label>
            <input type="number" id="maxFontSize" value="12" min="8" max="20">
        </div>
        <div class="form-group col">
            <label for="fontFamily">نوع الخط:</label>
            <select id="fontFamily">
                <option value="system-ui, -apple-system, sans-serif">خط النظام الافتراضي</option>
                <option value="Cairo">خط كايرو (Cairo)</option>
                <option value="Tajawal">خط تجوال (Tajawal)</option>
                <option value="Amiri">خط أميري (Amiri)</option>
            </select>
        </div>
    </div>

    <button id="generateBtn">توليد وتحميل السجل 🚀</button>

    <div id="status"></div>

    <div class="footer">
        <span>عمل وتطوير الطالب: علي ياسر أحمد محمد</span>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
